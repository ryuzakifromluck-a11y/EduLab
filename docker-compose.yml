# Local PostgreSQL for the accounts API:
#   docker compose up -d
#   DATABASE_URL=postgres://edulab:edulab@localhost:5432/edulab   (put it in .env.local)
#   npm run migrate && npm run api
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: edulab
      POSTGRES_PASSWORD: edulab
      POSTGRES_DB: edulab
    ports: ['5432:5432']
    volumes: ['edulab-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edulab']
      interval: 5s
      retries: 10
volumes:
  edulab-db:
