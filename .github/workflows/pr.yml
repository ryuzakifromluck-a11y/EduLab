name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - id: lint
        continue-on-error: true
        run: npm run lint

      - id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - id: test
        continue-on-error: true
        run: npm test

      - id: build
        continue-on-error: true
        run: npm run build

      - name: Comment results
        if: always()
        # Fork PRs get a read-only token, so commenting may fail there.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        with:
          script: |
            const marker = '<!-- edulab-pr-checks -->'
            const icon = (o) => (o === 'success' ? '✅' : o === 'skipped' ? '⏭️' : '❌')
            const rows = [
              ['Lint', process.env.LINT],
              ['Typecheck', process.env.TYPECHECK],
              ['Test', process.env.TEST],
              ['Build', process.env.BUILD],
            ]
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### PR checks',
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...rows.map(([name, o]) => `| ${name} | ${icon(o)} ${o} |`),
              '',
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · [run details](${runUrl})`,
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Fail if any check failed
        if: steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success'
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "lint=$LINT typecheck=$TYPECHECK test=$TEST build=$BUILD"
          exit 1
