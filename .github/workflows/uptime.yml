name: Uptime

# Hourly check of the live site with scripts/smoke.mjs. When it fails, an issue labelled
# `uptime` is opened (or commented on, if one is already open); when the site recovers,
# that issue is closed. Set the PRODUCTION_URL repository variable (and optionally
# API_URL for the accounts API) under Settings → Secrets and variables → Actions → Variables.
# Each run takes about a minute of Actions time (~720 min/month at this schedule).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Smoke test production
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: smoke
        continue-on-error: true
        env:
          SITE: ${{ vars.PRODUCTION_URL }}
          API: ${{ vars.API_URL }}
        run: |
          set -o pipefail
          node scripts/smoke.mjs "$SITE" ${API:+--api "$API"} --retries 3 2>&1 | tee smoke.log

      - name: Open, update or close the uptime issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          SITE: ${{ vars.PRODUCTION_URL }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const title = 'Uptime check failing'
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'uptime', per_page: 10 })).data
              .find((i) => i.title === title)

            if (process.env.OUTCOME === 'success') {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `✅ Recovered: all checks pass again. [run](${runUrl})` })
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' })
              }
              return
            }

            const log = fs.existsSync('smoke.log') ? fs.readFileSync('smoke.log', 'utf8').slice(-3000) : '(no output)'
            const body = [`❌ Smoke test failed for ${process.env.SITE} at ${new Date().toISOString()}. [run](${runUrl})`, '', '```', log, '```'].join('\n')
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['uptime'] })
            }
            core.setFailed('Uptime check failed')
